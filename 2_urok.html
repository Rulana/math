<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<meta name="claude:viewport-fit-sides" content="cover">
<title>Умножение в столбик</title>
<style>
:root{
  --bg:#f6f4ef; --card:#ffffff; --fg:#1f2430; --muted:#5f6675;
  --accent:#2f6fdb; --accent-fg:#ffffff; --ok:#17803f; --bad:#d9822b;
  --line:#cfcabd; --dot:#d9d5ca; --okbg:#e3f3e8; --badbg:#fdeedb; --focus:#dce8fb;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14171f; --card:#1d222d; --fg:#eef0f5; --muted:#9aa2b2;
    --accent:#6ea2ff; --accent-fg:#0d1220; --ok:#4cd17f; --bad:#ffb366;
    --line:#3a4254; --dot:#3a4254; --okbg:#1f3328; --badbg:#4a3018; --focus:#26324a; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#14171f; --card:#1d222d; --fg:#eef0f5; --muted:#9aa2b2;
  --accent:#6ea2ff; --accent-fg:#0d1220; --ok:#4cd17f; --bad:#ffb366;
  --line:#3a4254; --dot:#3a4254; --okbg:#1f3328; --badbg:#4a3018; --focus:#26324a; color-scheme:dark;
}
body{
  background:var(--bg); color:var(--fg); margin:0;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  line-height:1.45; padding-block:24px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.wrap{max-width:420px;margin:0 auto}
h1{font-size:22px;margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px}
.meta{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:13px;margin-bottom:12px}
.dots{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;justify-content:center}
.dot{width:9px;height:9px;border-radius:50%;background:var(--dot)}
.dot.done{background:var(--accent)}
.dot.now{outline:2px solid var(--accent);outline-offset:2px}
.task{font-size:14px;color:var(--muted);text-align:center;margin:8px 0 4px}

/* столбик на клетках */
.sheet{margin:8px auto 0;border-collapse:collapse}
.sheet td{width:56px;height:56px;text-align:center;font-size:28px;font-weight:600;font-variant-numeric:tabular-nums;padding:0;border:1px solid var(--line)}
.sheet td.sign{width:34px;border:none;font-size:24px;color:var(--muted)}
.sheet td.none{border:none}
.sheet tr.res td{border-top:3px solid var(--fg)}
.sheet tr.names td{border:none;font-size:12px;color:var(--muted);height:20px;font-weight:400}
.sheet input{width:100%;height:100%;box-sizing:border-box;border:0;background:transparent;text-align:center;font:inherit;color:var(--fg);outline:none;padding:0;caret-color:var(--accent)}
.sheet input:focus{background:var(--focus)}
.sheet input:disabled{opacity:1;-webkit-text-fill-color:var(--fg)}
.sheet td.ok{background:var(--okbg)}
.sheet td.bad{background:var(--badbg)}
.sheet td.reveal{color:var(--accent)}
.sheet tr.mult td{font-size:28px}

.row{display:flex;gap:10px;margin-top:18px;justify-content:center}
button.primary,button.ghost{font:inherit;font-weight:600;border-radius:10px;padding:12px 18px;cursor:pointer}
button.primary{background:var(--accent);color:var(--accent-fg);border:0}
button.ghost{background:var(--card);color:var(--fg);border:1px solid var(--line)}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.fb{min-height:44px;margin-top:14px;text-align:center;font-size:16px}
.fb.ok{color:var(--ok);font-weight:600}
.fb.bad{color:var(--bad);font-weight:600}

.start{text-align:center}
.name{width:100%;font:inherit;font-size:20px;padding:10px;border:2px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg);text-align:center;margin:8px 0 16px}
.who{font-size:14px;color:var(--muted);margin-bottom:12px}
.summary{text-align:center}
.summary .check{width:64px;height:64px;margin:0 auto 8px;border-radius:50%;background:var(--ok);color:#fff;font-size:36px;font-weight:700;line-height:64px}
.summary .big{font-size:48px;font-weight:700;font-variant-numeric:tabular-nums;margin:8px 0}
.summary .todo{text-align:left;margin:16px 0 0;padding-top:12px;border-top:1px solid var(--line)}
.summary .todo ul{margin:8px 0 0;padding-left:20px;font-variant-numeric:tabular-nums}
.summary .closing{margin-top:16px;font-weight:600;font-size:18px}
.summary .actions{display:flex;justify-content:center;margin-top:16px}
</style>

<div class="wrap">
  <h1>Умножение в столбик</h1>
  <div class="card" id="app"></div>
</div>

<script>
// Умножение в столбик на однозначное число без перехода через десяток.
// Все произведения цифр меньше 10, поэтому переносов нет.
// Проверка 100%: 15 примеров, каждый решён без ошибок с первой попытки.
// Два примера подряд с ошибкой: перерыв, затем проверка заново с новыми примерами.
const MAX_REPEATS = 2;
const TOTAL = 15;

const PLACE_NAMES = {
  2: ["десятки", "единицы"],
  3: ["сотни", "десятки", "единицы"]
};
const GROUP_LABELS = {
  2: "двузначные числа",
  3: "трёхзначные числа"
};

const TODAY = new Date().toLocaleDateString("ru-RU");
let playerName = "";
let consecutiveFails = 0;

function rnd(min, max){ return min + Math.floor(Math.random() * (max - min + 1)); }

// Цифры множимого выбираются так, чтобы цифра × множитель была не больше 9.
function makeProblem(len, mMin, mMax){
  const m = rnd(mMin, mMax);
  const maxD = Math.floor(9 / m);
  const digits = [];
  for (let i = 0; i < len; i++) digits.push(i === 0 ? rnd(1, maxD) : rnd(0, maxD));
  return { digits, m, len, a: Number(digits.join("")) };
}

function makeTasks(){
  const used = new Set();
  const out = [];
  function add(len, mMin, mMax){
    for (let t = 0; t < 300; t++){
      const p = makeProblem(len, mMin, mMax);
      const key = p.a + "x" + p.m;
      if (!used.has(key)){ used.add(key); out.push(p); return; }
    }
  }
  for (let i = 0; i < 5; i++) add(2, 2, 5);   // 2-значные, множитель 2–5
  for (let i = 0; i < 5; i++) add(2, 2, 4);   // 2-значные, множитель 2–4
  for (let i = 0; i < 5; i++) add(3, 2, 9);   // 3-значные
  return shuffle(out);
}

function shuffle(arr){
  for (let i = arr.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

let queue = [];
let qi = 0;
let total = 0;
let firstTry = 0;
let streak = 0;
let missed = [];
let resolved = new Set();
let groupStats = {};
let wrongChecks = 0;
let solved = false;

const app = document.getElementById("app");

function init(){
  const tasks = makeTasks();
  total = tasks.length;
  queue = tasks.map((p, i) => ({ ...p, orig: i, repeat: 0 }));
  qi = 0; firstTry = 0; streak = 0; missed = []; resolved = new Set();
  wrongChecks = 0; solved = false; consecutiveFails = 0;
  groupStats = { 2: { total: 0, ok: 0 }, 3: { total: 0, ok: 0 } };
  queue.forEach(p => groupStats[p.len].total++);
}

function who(){ return `<div class="who">Ребёнок: ${playerName} · ${TODAY}</div>`; }

function startScreen(){
  app.innerHTML = `
    <div class="start">
      <div class="who">Введите имя ребёнка</div>
      <input type="text" id="nm" class="name" maxlength="40" autocomplete="off">
      <div class="row"><button class="primary" id="go">Начать</button></div>
      <div class="fb" id="fb" aria-live="polite"></div>
    </div>`;
  const nm = document.getElementById("nm");
  const fb = document.getElementById("fb");
  nm.focus();
  const go = () => {
    const v = nm.value.trim();
    if (!v){ fb.className = "fb bad"; fb.textContent = "Напиши имя."; return; }
    playerName = v;
    restart();
  };
  document.getElementById("go").addEventListener("click", go);
  nm.addEventListener("keydown", e => { if (e.key === "Enter") go(); });
}

function render(){
  if (qi < queue.length) renderTask();
  else renderSummary();
}

function renderTask(){
  const p = queue[qi];
  const L = p.len;
  const names = PLACE_NAMES[L];
  const label = p.repeat === 0
    ? `Пример ${p.orig + 1} из ${total}`
    : `Повторим: пример ${p.orig + 1} из ${total}`;
  const dots = Array.from({ length: total }, (_, k) =>
    `<span class="dot ${resolved.has(k) ? "done" : ""} ${k === p.orig ? "now" : ""}"></span>`
  ).join("");
  const streakTxt = streak >= 2 ? ` · подряд: ${streak}` : "";

  const givenRow = `<tr>
      <td class="sign none"></td>
      ${p.digits.map(d => `<td>${d}</td>`).join("")}
    </tr>`;
  const multRow = `<tr class="mult">
      <td class="sign none">×</td>
      ${Array(L - 1).fill('<td class="none"></td>').join("")}
      <td class="none">${p.m}</td>
    </tr>`;
  const resRow = `<tr class="res">
      <td class="sign none"></td>
      ${p.digits.map((_, i) =>
        `<td><input data-i="${i}" maxlength="1" inputmode="numeric" autocomplete="off" aria-label="${names[i]}"></td>`
      ).join("")}
    </tr>`;
  const namesRow = `<tr class="names">
      <td class="sign none"></td>
      ${names.map(n => `<td>${n}</td>`).join("")}
    </tr>`;

  app.innerHTML = `
    <div class="meta"><span>${label}</span><span>Верно сразу: ${firstTry}${streakTxt}</span></div>
    <div class="dots">${dots}</div>
    <div class="task">Запиши ответ в клетки, начиная справа</div>
    <table class="sheet">${givenRow}${multRow}${resRow}${namesRow}</table>
    <div class="row"><button class="primary" id="check">Проверить</button></div>
    <div class="fb" id="fb" aria-live="polite"></div>`;

  const inputs = [...app.querySelectorAll("input")];
  const btn = document.getElementById("check");
  const fb = document.getElementById("fb");
  const exp = p.digits.map(d => d * p.m);

  inputs.forEach((inp, i) => {
    const td = inp.parentElement;
    inp.addEventListener("input", () => {
      inp.value = inp.value.replace(/\D/g, "").slice(-1);
      td.classList.remove("bad");
      if (inp.value && i > 0) inputs[i - 1].focus();
    });
    inp.addEventListener("keydown", (e) => {
      if (e.key === "Enter") { onCheck(); return; }
      if (e.key === "Backspace" && !inp.value && i < L - 1) inputs[i + 1].focus();
    });
  });

  inputs[L - 1].focus();

  const onCheck = () => {
    if (solved) { next(); return; }

    const empty = inputs.findIndex(inp => inp.value === "");
    if (empty !== -1) {
      fb.className = "fb bad";
      fb.textContent = `Заполни клетку «${names[empty]}».`;
      inputs[empty].focus();
      return;
    }

    const wrong = [];
    inputs.forEach((inp, i) => {
      const td = inp.parentElement;
      if (Number(inp.value) === exp[i]) {
        inp.disabled = true;
        td.classList.remove("bad");
        td.classList.add("ok");
      } else {
        wrong.push(i);
        td.classList.add("bad");
      }
    });

    if (wrong.length === 0) {
      solved = true;
      if (p.repeat === 0 && wrongChecks === 0) {
        firstTry++;
        groupStats[L].ok++;
      }
      consecutiveFails = wrongChecks > 0 ? consecutiveFails + 1 : 0;
      streak++;
      resolved.add(p.orig);
      fb.className = "fb ok";
      fb.textContent = "Верно!";
      btn.textContent = "Дальше";
      btn.focus();
      return;
    }

    wrongChecks++;
    streak = 0;

    if (wrongChecks < 2) {
      const i = wrong[0];
      inputs[i].focus();
      fb.className = "fb bad";
      fb.textContent = `Проверь выделенные клетки. Разряд «${names[i]}»: ${p.digits[i]} × ${p.m}.`;
      return;
    }

    solved = true;
    consecutiveFails++;
    resolved.add(p.orig);
    wrong.forEach(i => {
      inputs[i].value = String(exp[i]);
      inputs[i].disabled = true;
      inputs[i].parentElement.classList.remove("bad");
      inputs[i].parentElement.classList.add("reveal");
    });
    const text = `${p.a} × ${p.m} = ${p.a * p.m}`;
    if (!missed.some(m => m.text === text)) missed.push({ text });
    let tail = "";
    if (p.repeat < MAX_REPEATS) {
      queue.push({ ...p, repeat: p.repeat + 1 });
      tail = " Этот пример вернётся позже.";
    }
    fb.className = "fb bad";
    fb.textContent = `Правильный ответ: ${p.a * p.m}.${tail}`;
    btn.textContent = "Дальше";
    btn.focus();
  };

  btn.addEventListener("click", onCheck);
}

function next(){
  qi++;
  wrongChecks = 0;
  solved = false;
  if (consecutiveFails >= 2 && qi < queue.length) renderBreak();
  else render();
}

function renderBreak(){
  app.innerHTML = `
    <div class="summary">
      ${who()}
      <div class="closing">Небольшой перерыв</div>
      <div>Два примера подряд дались трудно. Это нормально. Отдохни минуту и начни заново с новыми примерами.</div>
      <div class="actions"><button class="primary" id="again">Начать заново</button></div>
    </div>`;
  document.getElementById("again").addEventListener("click", restart);
}

function renderSummary(){
  const pass = firstTry === total;
  const active = Object.keys(groupStats).filter(k => groupStats[k].total > 0);
  const rows = active.map(k =>
    `<li>${GROUP_LABELS[k]}: ${groupStats[k].ok} из ${groupStats[k].total}</li>`).join("");
  const missedBlock = missed.length
    ? `<div class="todo">Повторить:<ul>${missed.map(m => `<li>${m.text}</li>`).join("")}</ul></div>`
    : "";

  app.innerHTML = `
    <div class="summary">
      ${who()}
      ${pass ? `<div class="check" aria-label="Пройдено">✓</div>` : ""}
      <div class="closing">${pass ? "Пройдено: 15 из 15 без ошибок" : "Пока не пройдено"}</div>
      <div class="big">${firstTry} из ${total}</div>
      <div>${pass ? "все примеры решены сразу" : "нужно решить все примеры без ошибок. Начнём заново с новыми примерами."}</div>
      <div class="todo">По группам:<ul>${rows}</ul></div>
      ${missedBlock}
      <div class="actions"><button class="primary" id="again">${pass ? "Новая проверка" : "Начать заново"}</button></div>
    </div>`;
  document.getElementById("again").addEventListener("click", restart);
}

function restart(){
  init();
  render();
}

startScreen();
</script>

</body></html>
