<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<meta name="claude:viewport-fit-sides" content="cover">
<title>Таблица умножения</title>
<style>
:root{
  --bg:#f6f4ef; --card:#ffffff; --fg:#1f2430; --muted:#5f6675;
  --accent:#2f6fdb; --accent-fg:#ffffff; --ok:#17803f; --bad:#d9822b;
  --line:#e2dfd6; --dot:#d9d5ca;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14171f; --card:#1d222d; --fg:#eef0f5; --muted:#9aa2b2;
    --accent:#6ea2ff; --accent-fg:#0d1220; --ok:#4cd17f; --bad:#ffb366;
    --line:#2c3342; --dot:#3a4254; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#14171f; --card:#1d222d; --fg:#eef0f5; --muted:#9aa2b2;
  --accent:#6ea2ff; --accent-fg:#0d1220; --ok:#4cd17f; --bad:#ffb366;
  --line:#2c3342; --dot:#3a4254; color-scheme:dark;
}
body{
  background:var(--bg); color:var(--fg); margin:0;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  line-height:1.45; padding-block:24px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.wrap{max-width:420px;margin:0 auto}
h1{font-size:22px;margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px}
.meta{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:13px;margin-bottom:12px}
.dots{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;justify-content:center}
.dot{width:9px;height:9px;border-radius:50%;background:var(--dot)}
.dot.done{background:var(--accent)}
.dot.now{outline:2px solid var(--accent);outline-offset:2px}
.q{font-size:40px;font-weight:700;text-align:center;margin:16px 0 18px;font-variant-numeric:tabular-nums}
.row{display:flex;gap:10px;justify-content:center}
input{flex:1;min-width:0;font:inherit;font-size:24px;text-align:center;padding:10px;
  border:2px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg)}
input:focus-visible{outline:none;border-color:var(--accent)}
input:disabled{opacity:.6}
button.primary,button.ghost{font:inherit;font-weight:600;border-radius:10px;padding:12px 18px;cursor:pointer}
button.primary{background:var(--accent);color:var(--accent-fg);border:0}
button.ghost{background:var(--card);color:var(--fg);border:1px solid var(--line)}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.fb{min-height:28px;margin-top:14px;text-align:center;font-size:16px}
.fb.ok{color:var(--ok);font-weight:600}
.fb.bad{color:var(--bad);font-weight:600}
.start{text-align:center}
.name{width:100%;font:inherit;font-size:20px;padding:10px;border:2px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg);text-align:center;margin:8px 0 16px}
.who{font-size:14px;color:var(--muted);margin-bottom:12px}
.summary{text-align:center}
.summary .check{width:64px;height:64px;margin:0 auto 8px;border-radius:50%;background:var(--ok);color:#fff;font-size:36px;font-weight:700;line-height:64px}
.summary .big{font-size:48px;font-weight:700;font-variant-numeric:tabular-nums;margin:8px 0}
.summary .closing{margin:12px 0 8px;font-weight:600;font-size:18px}
.summary .actions{display:flex;justify-content:center;margin-top:20px}
</style>

<div class="wrap">
  <h1>Таблица умножения</h1>
  <div class="card" id="app"></div>
</div>

<script>
// 15 примеров, 100% без ошибок. Один пример — одна попытка, без повторов в ходе проверки.
// Первая ошибка: подсказка. Вторая: правильный ответ показывается. Два примера подряд
// с ошибкой: перерыв, и проверка начинается заново с новыми примерами.
const TOTAL = 15;

function rnd(min, max){ return min + Math.floor(Math.random() * (max - min + 1)); }

function shuffle(arr){
  for (let i = arr.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

// Подсказка-приём, которая не называет ответ.
function hint(a, b){
  const s = Math.min(a, b), l = Math.max(a, b);
  if (l === 9) return `${s} × 9 = ${s} × 10 − ${s}`;
  if (l >= 6)  return `${s} × ${l} = ${s} × 5 + ${s} × ${l - 5}`;
  return `${s} × ${l} = ${s} × ${l - 1} + ${s}`;
}

function makeTasks(){
  const used = new Set();
  const out = [];
  function add(gen){
    for (let t = 0; t < 200; t++){
      const [a, b] = gen();
      const key = Math.min(a, b) + "x" + Math.max(a, b);
      if (!used.has(key)){ used.add(key); out.push({ a, b }); return; }
    }
  }
  for (let i = 0; i < 5; i++) add(() => [rnd(2,5), rnd(2,5)]);
  for (let i = 0; i < 5; i++) add(() => {
    const s = rnd(2,5), b = rnd(6,9);
    return Math.random() < 0.5 ? [s, b] : [b, s];
  });
  for (let i = 0; i < 5; i++) add(() => [rnd(6,9), rnd(6,9)]);
  return shuffle(out);
}

const app = document.getElementById("app");
const TODAY = new Date().toLocaleDateString("ru-RU");
let playerName = "";
let queue = [];
let qi = 0;
let firstTry = 0;        // примеры решены сразу, без ошибок
let consecutiveFails = 0;
let wrongOnTask = 0;
let solved = false;

function who(){ return `<div class="who">Ребёнок: ${playerName} · ${TODAY}</div>`; }

function finishItem(clean){
  solved = true;
  if (clean){ firstTry++; consecutiveFails = 0; }
  else consecutiveFails++;
}

function startScreen(){
  app.innerHTML = `
    <div class="start">
      <div class="meta"><span>Введите имя ребёнка</span></div>
      <input type="text" id="nm" class="name" maxlength="40" autocomplete="off">
      <div class="row"><button class="primary" id="go">Начать</button></div>
      <div class="fb" id="fb" aria-live="polite"></div>
    </div>`;
  const nm = document.getElementById("nm");
  const fb = document.getElementById("fb");
  nm.focus();
  const go = () => {
    const v = nm.value.trim();
    if (!v){ fb.className = "fb bad"; fb.textContent = "Напиши имя."; return; }
    playerName = v;
    restart();
  };
  document.getElementById("go").addEventListener("click", go);
  nm.addEventListener("keydown", e => { if (e.key === "Enter") go(); });
}

function restart(){
  queue = makeTasks();
  qi = 0; firstTry = 0; consecutiveFails = 0; wrongOnTask = 0; solved = false;
  render();
}

function render(){
  if (qi < queue.length) renderTask();
  else renderSummary();
}

function next(){
  qi++;
  wrongOnTask = 0;
  solved = false;
  if (consecutiveFails >= 2 && qi < queue.length) renderBreak();
  else render();
}

function renderTask(){
  const item = queue[qi];
  const dots = Array.from({ length: TOTAL }, (_, k) =>
    `<span class="dot ${k < qi ? "done" : ""} ${k === qi ? "now" : ""}"></span>`
  ).join("");

  app.innerHTML = `
    <div class="meta"><span>Пример ${qi + 1} из ${TOTAL}</span><span>Верно сразу: ${firstTry}</span></div>
    <div class="dots">${dots}</div>
    <div class="q">${item.a} × ${item.b} = ?</div>
    <div class="row">
      <input id="ans" type="number" inputmode="numeric" autocomplete="off" aria-label="Твой ответ">
      <button class="primary" id="check">Проверить</button>
    </div>
    <div class="fb" id="fb" aria-live="polite"></div>`;

  const input = document.getElementById("ans");
  const btn = document.getElementById("check");
  const fb = document.getElementById("fb");
  input.focus();

  const onCheck = () => {
    if (solved) { next(); return; }
    const raw = input.value.trim();
    if (raw === "") {
      fb.className = "fb bad";
      fb.textContent = "Напиши ответ.";
      input.focus();
      return;
    }
    const correct = item.a * item.b;

    if (Number(raw) === correct) {
      finishItem(wrongOnTask === 0);
      fb.className = "fb ok";
      fb.textContent = "Верно!";
      input.disabled = true;
      btn.textContent = "Дальше";
      btn.focus();
      return;
    }

    wrongOnTask++;
    input.value = "";
    if (wrongOnTask < 2) {
      fb.className = "fb bad";
      fb.textContent = "Неверно. Подсказка: " + hint(item.a, item.b);
      input.focus();
      return;
    }

    // Вторая ошибка: показываем ответ, пример засчитан как не пройденный.
    finishItem(false);
    fb.className = "fb bad";
    fb.textContent = `Правильный ответ: ${correct}.`;
    input.disabled = true;
    btn.textContent = "Дальше";
    btn.focus();
  };

  btn.addEventListener("click", onCheck);
  input.addEventListener("keydown", e => { if (e.key === "Enter") onCheck(); });
}

function renderBreak(){
  app.innerHTML = `
    <div class="summary">
      ${who()}
      <div class="closing">Небольшой перерыв</div>
      <div>Два примера подряд дались трудно. Это нормально. Отдохни минуту и начни заново с новыми примерами.</div>
      <div class="actions"><button class="primary" id="again">Начать заново</button></div>
    </div>`;
  document.getElementById("again").addEventListener("click", restart);
}

function renderSummary(){
  const pass = firstTry === TOTAL;
  app.innerHTML = `
    <div class="summary">
      ${who()}
      ${pass ? `<div class="check" aria-label="Пройдено">✓</div>` : ""}
      <div class="closing">${pass ? "Пройдено без ошибок" : "Пока не пройдено"}</div>
      <div class="big">${firstTry} из ${TOTAL}</div>
      <div>${pass
        ? "все примеры решены сразу"
        : "нужно решить все примеры без ошибок. Начнём заново с новыми примерами."}</div>
      <div class="actions"><button class="primary" id="again">${pass ? "Новая проверка" : "Начать заново"}</button></div>
    </div>`;
  document.getElementById("again").addEventListener("click", restart);
}

startScreen();
</script>

</body></html>
